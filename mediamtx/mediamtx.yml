# mediamtx config for the W17 ground station.
# Ingests the OpenIPC camera's RTSP stream and republishes it as WebRTC/WHEP
# for the Electron renderer. Pin the mediamtx version you fetch (see
# scripts/fetch-mediamtx.js) so these keys stay valid.
#
# BENCH: set `source` to the real camera URL from majestic_fpv.yaml (see
# docs/SETUP.md). If the camera emits H.265, WebRTC will NOT play it in
# Chromium -- reconfigure the camera to H.264 or transcode (docs/SETUP.md #1).

logLevel: info
logDestinations: [stdout]

# WebRTC / WHEP server. The laptop's renderer POSTs its SDP offer to
# http://127.0.0.1:8889/<path>/whep; the PHONE pulls the SAME endpoint over the
# car Wi-Fi hotspot (owner adjudication OD-16 / design Q8: transport (a), WHEP
# into a bundled web view, chosen for latency).
webrtc: yes
# TODAY'S TRUTH, unchanged: a bare `:8889` already binds EVERY interface, so the
# signalling endpoint was always reachable from the hotspot -- there is nothing
# to widen here, and nothing is widened.
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# ICE HOST CANDIDATES. This list is what mediamtx ADVERTISES as reachable
# addresses; a viewer that cannot reach any advertised candidate gets signalling
# and then silence. 127.0.0.1 serves the laptop's own renderer.
#
# 192.168.137.1 is the address the phone is EXPECTED to see this laptop at.
# [win-TBD] -- that expectation is not verified here and has never been observed
# on real Windows. What this repo actually checks is the /24, not the .1:
# main/hotspot.js icsHostIp() returns the first non-internal IPv4 starting
# "192.168.137." (whatever the last octet turns out to be), and
# main/hotspotVerify.js icsGateway() matches the same prefix on the same
# interface. ".1" is Windows ICS convention, not something this code asserts, so
# a host that lands on another address in that /24 would be advertised wrongly
# here. It is listed explicitly rather than trusting interface auto-detection to
# have enumerated an ICS adapter that may have appeared after mediamtx started.
# docs/GIFTEE_FIRST_LAUNCH.md hedges the same fact the same way; WS3 is where it
# gets settled.
# Harmless with no hotspot up: an unreachable candidate simply loses the ICE
# race, and the loopback one still wins for the local renderer.
webrtcAdditionalHosts: [127.0.0.1, 192.168.137.1]

# RTSP server stays available too (so VLC/the fallback can hit mediamtx, and
# for the offline demo re-publish).
rtspAddress: :8554
api: no

paths:
  # The live camera feed. Replace the source with the real RTSP URL.
  cam:
    source: rtsp://192.168.1.10:554/stream0
    sourceOnDemand: yes

  # Offline demo path: publish a local file to exercise the exact WHEP path
  # with no camera. Start it with:
  #   mediamtx  (then) ffmpeg -re -stream_loop -1 -i demo.mp4 -c:v libx264 \
  #     -f rtsp rtsp://127.0.0.1:8554/cam
  # or point `source` above at a file:// via ffmpeg. See docs/SETUP.md.
